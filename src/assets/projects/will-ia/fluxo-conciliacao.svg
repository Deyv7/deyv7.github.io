  <line x1="1440" y1="373" x2="1440" y2="440" stroke="#8a857c" stroke-width="3.5" marker-end="url(#seta)"/>
  <path d="M1340 373 V 405 H 1020 V 440" fill="none" stroke="#8a857c" stroke-width="3.5" marker-end="url(#seta)"/>

