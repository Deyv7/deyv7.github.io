  <text x="1020" y="558" text-anchor="middle" font-size="21" fill="#2f6b4f">recibo gerado</text>

  <rect x="1240" y="450" width="320" height="150" rx="22" fill="#fbf1dc" stroke="#b7892f" stroke-width="2.5"/>
