<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a857c"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="#f6f4ef"/>
  <text x="120" y="110" font-size="40" font-weight="600" fill="#22201c">Validação de cadastro de instrutor</text>

  <!-- Linha 1: entrada -->
  <rect x="120" y="180" width="420" height="150" rx="22" fill="#fffdf9" stroke="#d9d4ca" stroke-width="2.5"/>
  <text x="330" y="248" text-anchor="middle" font-size="32" font-weight="600" fill="#22201c">Novo cadastro</text>
  <text x="330" y="288" text-anchor="middle" font-size="22" fill="#6b6760">documentos enviados</text>

  <line x1="548" y1="255" x2="600" y2="255" stroke="#8a857c" stroke-width="3.5" marker-end="url(#seta)"/>

  <rect x="610" y="180" width="420" height="150" rx="22" fill="#fffdf9" stroke="#d9d4ca" stroke-width="2.5"/>
  <text x="820" y="248" text-anchor="middle" font-size="32" font-weight="600" fill="#22201c">Webhook FastAPI</text>
  <text x="820" y="288" text-anchor="middle" font-size="22" fill="#6b6760">dispara a validação</text>

  <line x1="1038" y1="255" x2="1090" y2="255" stroke="#8a857c" stroke-width="3.5" marker-end="url(#seta)"/>

  <rect x="1100" y="180" width="420" height="150" rx="22" fill="#22201c"/>
  <text x="1310" y="248" text-anchor="middle" font-size="32" font-weight="600" fill="#f6f4ef">Agente de validação</text>
  <text x="1310" y="288" text-anchor="middle" font-size="22" fill="#bdb7ac">Agno + Gemini</text>

  <line x1="1310" y1="338" x2="1310" y2="430" stroke="#8a857c" stroke-width="3.5" marker-end="url(#seta)"/>

  <!-- Linha 2: etapas (da direita para a esquerda) -->
  <rect x="1100" y="440" width="420" height="150" rx="22" fill="#fffdf9" stroke="#d9d4ca" stroke-width="2.5"/>
  <text x="1310" y="508" text-anchor="middle" font-size="32" font-weight="600" fill="#22201c">1 · OCR</text>
  <text x="1310" y="548" text-anchor="middle" font-size="22" fill="#6b6760">CNH, certidão e endereço</text>

  <line x1="1092" y1="515" x2="1040" y2="515" stroke="#8a857c" stroke-width="3.5" marker-end="url(#seta)"/>

  <rect x="610" y="440" width="420" height="150" rx="22" fill="#fffdf9" stroke="#d9d4ca" stroke-width="2.5"/>
  <text x="820" y="508" text-anchor="middle" font-size="32" font-weight="600" fill="#22201c">2 · Validação cruzada</text>
  <text x="820" y="548" text-anchor="middle" font-size="22" fill="#6b6760">documentos x cadastro</text>

  <line x1="602" y1="515" x2="550" y2="515" stroke="#8a857c" stroke-width="3.5" marker-end="url(#seta)"/>

  <rect x="120" y="440" width="420" height="150" rx="22" fill="#fffdf9" stroke="#d9d4ca" stroke-width="2.5"/>
  <text x="330" y="508" text-anchor="middle" font-size="32" font-weight="600" fill="#22201c">3 · Nada consta</text>
  <text x="330" y="548" text-anchor="middle" font-size="22" fill="#6b6760">certidão de antecedentes</text>

  <!-- Linha 3: decisão -->
  <line x1="330" y1="598" x2="330" y2="710" stroke="#8a857c" stroke-width="3.5" marker-end="url(#seta)"/>
  <path d="M450 598 V 655 H 1187 V 710" fill="none" stroke="#8a857c" stroke-width="3.5" marker-end="url(#seta)"/>

  <rect x="120" y="720" width="665" height="160" rx="22" fill="#e3efe8" stroke="#2f6b4f" stroke-width="2.5"/>
  <text x="452" y="792" text-anchor="middle" font-size="34" font-weight="600" fill="#1f4d38">Tudo consistente</text>
  <text x="452" y="834" text-anchor="middle" font-size="22" fill="#2f6b4f">instrutor aprovado</text>

  <rect x="855" y="720" width="665" height="160" rx="22" fill="#fbf1dc" stroke="#b7892f" stroke-width="2.5"/>
  <text x="1187" y="792" text-anchor="middle" font-size="34" font-weight="600" fill="#6b4d12">Qualquer inconsistência</text>
  <text x="1187" y="834" text-anchor="middle" font-size="22" fill="#8a6418">vai para revisão humana</text>

  <text x="120" y="950" font-size="22" fill="#6b6760">Nunca aprova sem os 3 documentos. Falha de leitura em documento crítico vai direto para revisão humana.</text>
</svg>
